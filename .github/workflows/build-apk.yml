name: Build ScamLens APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Clean and create
        run: |
          rm -rf android ios web windows macos linux test
          flutter create --project-name scamlens --org com.scamlens.app --platforms android . --overwrite
      - name: Build APK
        run: flutter build apk --release --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScamLens-APK
          path: build/app/outputs/flutter-apk/app-release.apk
